
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>CANON JR AI</title>
<link rel="manifest" href="./manifest.webmanifest">

<style>
:root {
  --bg:#080808;
  --panel:#151515;
  --gold:#d6ad45;
  --light:#ffe7a6;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--light);
  font-family:Arial,sans-serif;
  display:flex;
  flex-direction:column;
}
header {
  padding:18px;
  display:flex;
  align-items:center;
  gap:14px;
  background:#111;
  border-bottom:1px solid var(--gold);
}
.logo {
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,#ffe7a6,#a87919);
  color:#080808;
  font-size:25px;
  font-weight:bold;
}
header h2 { margin:0;color:var(--gold); }
header small { color:#aaa; }
main {
  width:100%;
  max-width:850px;
  flex:1;
  margin:auto;
  padding:18px;
}
.welcome {
  text-align:center;
  margin:55px 0 35px;
}
.welcome h1 { color:var(--gold); }
.welcome p { color:#aaa; }
#chat {
  display:flex;
  flex-direction:column;
  gap:14px;
  padding-bottom:20px;
}
.msg {
  max-width:92%;
  padding:15px;
  border-radius:15px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.user {
  align-self:flex-end;
  background:#493713;
  border:1px solid var(--gold);
  color:white;
}
.bot {
  align-self:flex-start;
  background:var(--panel);
  border:1px solid #66501f;
}
.actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
.status {
  text-align:center;
  color:var(--gold);
  padding:10px;
  font-size:12px;
}
.controls,form {
  display:flex;
  gap:8px;
  padding:12px;
  background:#111;
  border-top:1px solid #71551b;
}
form { position:sticky;bottom:0; }
input {
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:12px;
  border:1px solid #8a6928;
  background:#080808;
  color:white;
  font-size:16px;
}
select {
  background:#171717;
  color:var(--light);
  border:1px solid var(--gold);
  border-radius:10px;
  padding:10px;
}
button {
  background:linear-gradient(135deg,#ffe29a,#b88725);
  color:#080808;
  border:0;
  border-radius:10px;
  padding:11px 13px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled { opacity:.5; }
.actions button { font-size:12px; }
@media(max-width:480px) {
  header h2 { font-size:17px; }
  .welcome h1 { font-size:22px; }
  form,.controls { padding:9px; }
  form button { padding:10px; }
}
</style>
</head>

<body>
<header>
  <div class="logo">C</div>
  <div>
    <h2>CANON JR AI</h2>
    <small>Your personal AI assistant</small>
  </div>
</header>

<main>
  <div class="welcome" id="welcome">
    <h1>WELCOME TO CANON JR AI</h1>
    <p>Intelligence. Innovation. Your future.</p>
  </div>
  <div id="chat"></div>
</main>

<div class="controls">
  <select id="voiceLanguage">
    <option value="en-US">English voice</option>
    <option value="sw-TZ">Kiswahili voice</option>
  </select>
  <button id="mic" type="button">🎙 START MIC</button>
</div>

<div class="status" id="status">CANON AI • READY</div>

<form id="form">
  <input id="message" placeholder="Ask CANON AI anything..." required>
  <button id="send" type="submit">SEND</button>
</form>

<script>
const form = document.getElementById("form");
const input = document.getElementById("message");
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");
const send = document.getElementById("send");
const welcome = document.getElementById("welcome");
const mic = document.getElementById("mic");
const language = document.getElementById("voiceLanguage");

let history = [];
let recognition = null;
let listening = false;

function addMessage(message,type) {
  welcome.style.display = "none";
  const div = document.createElement("div");
  div.className = "msg " + type;

  const content = document.createElement("div");
  content.textContent = message;
  div.appendChild(content);

  if(type === "bot") {
    const actions = document.createElement("div");
    actions.className = "actions";

    const translate = document.createElement("button");
    translate.textContent = "🌍 TRANSLATE TO SWAHILI";
    translate.type = "button";
    translate.onclick = () => translateMessage(message,div,translate);

    const speak = document.createElement("button");
    speak.textContent = "🔊 READ ALOUD";
    speak.type = "button";
    speak.onclick = () => speakMessage(message);

    actions.append(translate,speak);
    div.appendChild(actions);
  }

  chat.appendChild(div);
  window.scrollTo(0,document.body.scrollHeight);
}

async function translateMessage(original,container,button) {
  button.disabled = true;
  button.textContent = "TRANSLATING...";

  try {
    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        messages:[{
          role:"user",
          content:"Translate this into natural Kiswahili. Return only the translation:\n\n"+original
        }]
      })
    });

    const data = await response.json();
    if(!response.ok) throw new Error(data.error || "Translation failed");

    const result = document.createElement("div");
    result.style.marginTop = "12px";
    result.style.borderTop = "1px solid #8a6928";
    result.style.paddingTop = "12px";
    result.textContent = "KISWAHILI: " + data.reply;
    container.appendChild(result);
    button.textContent = "TRANSLATED";
  } catch(error) {
    button.textContent = "TRY AGAIN";
    statusText.textContent = error.message;
  } finally {
    button.disabled = false;
  }
}

function speakMessage(message) {
  if(!("speechSynthesis" in window)) {
    statusText.textContent = "Speech is not supported";
    return;
  }

  speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = language.value;
  speech.rate = 0.95;
  speech.pitch = 0.9;
  speechSynthesis.speak(speech);
  statusText.textContent = "CANON AI • SPEAKING";

  speech.onend = () => {
    statusText.textContent = "CANON AI • READY";
  };
}

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    listening = true;
    mic.textContent = "■ STOP MIC";
    statusText.textContent = "LISTENING...";
  };

  recognition.onresult = event => {
    let finalText = "";
    let interimText = "";

    for(let i=event.resultIndex;i<event.results.length;i++) {
      if(event.results[i].isFinal) {
        finalText += event.results[i][0].transcript;
      } else {
        interimText += event.results[i][0].transcript;
      }
    }

    if(finalText) {
      input.value = (input.value + " " + finalText).trim();
      statusText.textContent = "VOICE RECEIVED • PRESS SEND";
    } else if(interimText) {
      statusText.textContent = "HEARING: " + interimText;
    }
  };

  recognition.onerror = event => {
    statusText.textContent = "MIC ERROR: " + event.error;
  };

  recognition.onend = () => {
    listening = false;
    mic.textContent = "🎙 START MIC";
    if(statusText.textContent === "LISTENING...") {
      statusText.textContent = "CANON AI • READY";
    }
  };

  mic.onclick = () => {
    if(listening) {
      recognition.stop();
      return;
    }
    recognition.lang = language.value;
    try {
      recognition.start();
    } catch(error) {
      statusText.textContent = "MIC IS BUSY. TRY AGAIN.";
    }
  };
} else {
  mic.disabled = true;
  statusText.textContent = "VOICE INPUT NOT SUPPORTED. TRY CHROME.";
}

language.onchange = () => {
  if(listening) recognition.stop();
  if("speechSynthesis" in window) speechSynthesis.cancel();
};

form.onsubmit = async event => {
  event.preventDefault();

  const question = input.value.trim();
  if(!question) return;

  addMessage(question,"user");
  input.value = "";
  send.disabled = true;
  statusText.textContent = "CANON AI IS THINKING...";

  history.push({role:"user",content:question});

  try {
    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:history})
    });

    const data = await response.json();
    if(!response.ok) throw new Error(data.error || "AI connection failed");

    const answer = data.reply || "No response received.";
    addMessage(answer,"bot");
    history.push({role:"assistant",content:answer});
    statusText.textContent = "CANON AI • ONLINE";
  } catch(error) {
    history.pop();
    addMessage("Connection problem: "+error.message,"bot");
    statusText.textContent = "CANON AI • CONNECTION PROBLEM";
  } finally {
    send.disabled = false;
    input.focus();
  }
};

if("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .catch(error => console.log("Service worker:",error));
}
</script>
</body>
</html>
